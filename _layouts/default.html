<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <meta property="og:image" content="{{ '/photos/featured/feature-01.jpg' | absolute_url }}">
    <link rel="icon" type="image/png" href="{{ '/assets/images/uong_logo.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
  </head>
  <body>
    <nav class="site-nav">
      <div class="nav-inner">
        <a href="{{ '/' | relative_url }}" class="nav-logo">
          <img src="{{ '/assets/images/uong_logo.png' | relative_url }}" alt="{{ site.title }}">
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}">Home</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">About</a></li>
          <li><a href="{{ '/packages.html' | relative_url }}">Packages</a></li>
          <li><a href="{{ '/add-ons.html' | relative_url }}">Add-Ons</a></li>
          <li><a href="{{ '/gallery.html' | relative_url }}">Gallery</a></li>
          <li><a href="{{ '/faqs.html' | relative_url }}">FAQ</a></li>
          <li><a href="{{ '/contact.html' | relative_url }}">Contact</a></li>
        </ul>
      </div>
    </nav>
    <main class="page-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p>&copy; {{ site.time | date: '%Y' }} Joe Uong &nbsp;&middot;&nbsp; <a href="https://www.instagram.com/joe.jpgs/" target="_blank" rel="noopener">@joe.jpgs</a> on Instagram</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <script>GLightbox();</script>
    <script>
      (function() {
        var toggle = document.querySelector('.nav-toggle');
        var links = document.querySelector('.nav-links');
        toggle.addEventListener('click', function() {
          var open = links.classList.toggle('nav-open');
          toggle.setAttribute('aria-expanded', open);
        });
      })();
    </script>
  </body>
</html>
